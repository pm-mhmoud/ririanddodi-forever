<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#120f12">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Mahmoud & Riri — our little corner of the internet.">
  <title>Mahmoud & Riri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="progress-bar"><span id="progress"></span></div>
  <nav class="chapter-nav hidden" id="chapterNav" aria-label="Story chapters"></nav>

  <section class="intro" id="home">
    <div class="intro-orb orb-one"></div><div class="intro-orb orb-two"></div>
    <div class="intro-content">
      <div class="intro-mark">♥ M + R</div>
      <p class="eyebrow" id="introEyebrow"></p>
      <div class="intro-lines" id="introLines"></div>
      <button class="primary-button intro-button" id="enterBtn"></button>
    </div>
    <div class="scroll-hint">made quietly, with a ridiculous amount of love</div>
  </section>

  <main id="main" class="soft-locked">
    <section class="duration-band"><span id="daysTogether"></span><p id="durationText"></p></section>
    <section class="section story-section" id="story"></section>
    <section class="section one-photo-section" id="photo"></section>
    <section class="section reasons-section" id="reasons"></section>
    <section class="section map-section" id="places"></section>
    <section class="section quiz-section" id="quiz"></section>
    <section class="section letters-section" id="letters"></section>
    <section class="section rituals-section" id="rituals"></section>
    <section class="section future-section" id="future"></section>
    <section class="section video-section" id="video"></section>
    <section class="finale" id="finale"></section>
  </main>

  <div id="modalRoot"></div>
  <script src="siteContent.js"></script>
  <script src="app.js"></script>
</body>
</html>
